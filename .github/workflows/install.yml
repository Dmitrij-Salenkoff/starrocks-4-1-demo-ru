name: Verify the public demo
on:
  push:
    branches: [main]
    paths: [demo-edition.zip]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edition:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Install submitted weekly edition
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import subprocess
          archive = Path('demo-edition.zip')
          with ZipFile(archive) as bundle:
              entries = {Path(f.filename) for f in bundle.infolist() if not f.is_dir()}
              allowed_roots = {'weeks','preview','.vscode','README.md','START.md','ENGINEERING.md','.gitignore','.python-version','pyproject.toml','uv.lock','lab.py','smoke.py'}
              for p in entries:
                  if p.is_absolute() or '..' in p.parts or p.parts[0] not in allowed_roots:
                      raise ValueError(p)
                  if any(x in str(p).lower() for x in ('instructor','solution','script.md','video.md')):
                      raise ValueError(p)
              expected = {Path('weeks/01/01')}
              assert all(p.parts[:3] == ('weeks','01','01') or p == Path('weeks/01/README.md') for p in entries if p.parts[0] == 'weeks')
              for required in ('compose.yaml', 'slides.pdf', 'README.md', 'setup.sql', 'check.sql'):
                  found = {p.parent for p in entries if p.name == required and len(p.parts) == 4}
                  assert found == expected, (required, expected ^ found)
              assert not any(p.suffix.lower() in {'.mp4','.mov','.mkv','.webm','.srt','.vtt'} for p in entries)
              assert {Path('README.md'), Path('weeks/01/01/check.sql'), Path('smoke.py')} <= entries
              legacy = {'lessons','infra','tools','videos','verification','INSTRUCTOR.md','INSTRUCTOR.html'}
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if not name: continue
                  p = Path(name)
                  if p not in entries and p.parts[0] in legacy | allowed_roots:
                      p.unlink(missing_ok=True)
              bundle.extractall()
          archive.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish the demo lab and slide deck"
            git push origin HEAD:main
          fi
      - name: Select revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: edition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.edition.outputs.revision }}
          persist-credentials: false
      - name: Reserve runner disk for classroom tablets
        if: runner.environment == 'github-hosted'
        run: |
          if [ -d /usr/local/lib/android/sdk ]; then
            sudo rm -rf /usr/local/lib/android/sdk
          fi
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14 && uv sync --locked
      - run: uv run --locked python smoke.py 01/01
