services:
  starrocks:
    image: starrocks/allin1-ubuntu:4.1.4
    ports:
      - "127.0.0.1:9030:9030"
      - "127.0.0.1:8030:8030"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "./health_check.sh && mysql -h127.0.0.1 -P9030 -uroot -Nse 'SHOW BACKENDS' | grep -qi true"]
      start_period: 120s
      interval: 8s
      timeout: 8s
      retries: 35
